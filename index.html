<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>奇闻日报</title>
  <meta name="description" content="奇闻日报：只收集印度新闻和 X 素材，供选题和创作工具直接取用。">
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161411" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap brand-row">
      <p class="seal" aria-hidden="true">奇</p>
      <div class="brand-copy">
        <p class="eyebrow">每日收集 · 北京时间</p>
        <h1>奇闻日报</h1>
        <p class="tagline">只收印度。新闻和 X 帖子都在这一页，搜索、标签、热度还在。创作工具直接读每月的数据文件。</p>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="wrap">
      <div class="date-switch">
        <button type="button" id="older-day">上一天</button>
        <label class="date-picker">
          <span class="sr-only">选择日期</span>
          <select id="date-select"></select>
        </label>
        <button type="button" id="newer-day">下一天</button>
      </div>
      <div class="filters">
        <label class="search">
          <span class="sr-only">搜索</span>
          <input id="search" type="search" placeholder="搜索全部日期的标题、概要和标签" autocomplete="off" enterkeyhint="search">
        </label>
        <label class="source-filter">
          <span class="sr-only">来源</span>
          <select id="source">
            <option value="">全部来源</option>
          </select>
        </label>
        <label class="sort-filter">
          <span class="sr-only">排序</span>
          <select id="sort">
            <option value="time">按时间</option>
            <option value="heat">按热度</option>
          </select>
        </label>
        <label class="angle-filter">
          <span class="sr-only">X 素材角度</span>
          <select id="angle">
            <option value="">全部素材</option>
            <option value="官方">X 官方</option>
            <option value="离谱">X 离谱合集</option>
          </select>
        </label>
        <div class="regions" id="regions" role="group" aria-label="地区"></div>
        <div class="topics" id="topics" role="group" aria-label="选题标签"></div>
      </div>
      <p class="status-line" id="status" aria-live="polite">正在加载…</p>
    </div>
  </div>

  <main class="wrap">
    <h2 class="day-heading" id="day-heading"></h2>
    <p class="detail-bar" id="detail-bar" hidden></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>没有匹配的奇闻。</p>
    <div class="more-row">
      <button type="button" id="more" hidden>加载更多</button>
    </div>
    <div id="sentinel" aria-hidden="true"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>文章和图片版权归原发布者所有。新闻仍链到原文。X 的图片、头像和评论长图保存在本仓库，视频只留直链，不把视频文件放进仓库。直链会过期。评论长图是按真实回复渲染的，不是平台截图。</p>
      <p>只保留内容地区是印度的条目。印度媒体转载的外国新闻不会留下。部分原文可能含不适内容。时间均为北京时间。</p>
      <p><a href="https://github.com/wangningashui-netizen/odd-news">仓库与数据</a></p>
    </div>
  </footer>

  <div id="lightbox" class="lightbox" hidden>
    <button type="button" class="lightbox-backdrop" id="lightbox-backdrop" aria-label="关闭大图"></button>
    <figure class="lightbox-figure">
      <img id="lightbox-img" alt="" referrerpolicy="no-referrer">
      <figcaption id="lightbox-caption"></figcaption>
      <button type="button" class="lightbox-close" id="lightbox-close">关闭</button>
    </figure>
  </div>

  <noscript><p class="wrap">需要启用 JavaScript 才能浏览每日条目。</p></noscript>
  <script src="app.js"></script>
</body>
</html>
