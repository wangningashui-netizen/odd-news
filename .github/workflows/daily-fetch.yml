name: Daily odd news

on:
  schedule:
    # 23:00 UTC is 07:00 the next calendar morning in Asia/Shanghai (UTC+8, no DST).
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: odd-news-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds and translate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS_MODEL: openai/gpt-4o-mini
        run: python scripts/fetch_news.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: update daily odd news"
          git push origin "HEAD:${GITHUB_REF_NAME}"
