name: Ingest X inbox

on:
  push:
    paths:
      - "data/x/inbox/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odd-news-daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome, fonts, and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji wget
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb || (sudo dpkg -i /tmp/chrome.deb && sudo apt-get install -f -y)
          fi
          python -m pip install --upgrade yt-dlp pillow

      - name: Ingest inbox
        run: python scripts/ingest_x.py

      - name: Commit X material
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/x
          if git diff --cached --quiet; then
            echo "No X changes."
            exit 0
          fi
          git commit -m "chore: ingest X inbox"
          git push origin "HEAD:${GITHUB_REF_NAME}"
