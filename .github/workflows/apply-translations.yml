name: Apply translations

on:
  push:
    branches: [main]
    paths:
      - "data/translations/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odd-news-daily
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply translations
        run: python scripts/retranslate.py

      - name: Commit applied translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Translations already applied."
            exit 0
          fi
          git commit -m "chore: apply committed translations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
